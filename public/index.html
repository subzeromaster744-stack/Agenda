<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b8466c">
<title>Agenda de Cílios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: calendário mensal à esquerda, dia com horários ocupados e livres à direita; histórico e serviços em abas. */
:root {
  --bg: #f5f3f6;
  --surface: #ffffff;
  --surface-2: #efecf2;
  --ink: #241c2b;
  --muted: #6b6276;
  --line: #e0dae6;
  --accent: #b8466c;
  --accent-ink: #ffffff;
  --accent-soft: #f6e1e9;
  --free: #2b7556;
  --free-soft: #dff0e8;
  --warn: #a8500a;
  --warn-soft: #fbe9d6;
  --danger: #b3261e;
  --danger-soft: #fbe1de;
  --c-henna: #9a5b1f;
  --c-design: #1f7a8c;
  --c-manu: #b8466c;
  --c-colo: #6a4c93;
  --c-laser: #5b6472;
  color-scheme: light;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16121a; --surface: #1f1925; --surface-2: #2a2231; --ink: #f1ecf5; --muted: #a79db3; --line: #3a3043;
    --accent: #e0709a; --accent-ink: #1a0f15; --accent-soft: #3a2230;
    --free: #6fcf9f; --free-soft: #1c3328; --warn: #f0a35e; --warn-soft: #3a2a16;
    --danger: #ff8a80; --danger-soft: #3d1f1d;
    --c-henna: #d9a066; --c-design: #5cc0d3; --c-manu: #e0709a; --c-colo: #b79be0; --c-laser: #9aa4b2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16121a; --surface: #1f1925; --surface-2: #2a2231; --ink: #f1ecf5; --muted: #a79db3; --line: #3a3043;
  --accent: #e0709a; --accent-ink: #1a0f15; --accent-soft: #3a2230;
  --free: #6fcf9f; --free-soft: #1c3328; --warn: #f0a35e; --warn-soft: #3a2a16;
  --danger: #ff8a80; --danger-soft: #3d1f1d;
  --c-henna: #d9a066; --c-design: #5cc0d3; --c-manu: #e0709a; --c-colo: #b79be0; --c-laser: #9aa4b2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Cabeçalho */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 18px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-size: 26px; font-weight: 700; }
.brand span { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; margin-left: auto; background: var(--surface-2); padding: 4px; border-radius: 10px; }
.tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 7px; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 9px; font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.warn { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .6; cursor: default; }

.banner { padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); margin-bottom: 14px; font-weight: 500; }

/* Agenda */
.agenda { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.side { display: grid; gap: 16px; min-width: 0; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head h2 { font-size: 17px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 34px; height: 34px; border-radius: 9px; font-size: 16px; line-height: 1; }
.icon-btn:hover { background: var(--surface-2); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-dow { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; padding-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
.cal-cell { border: 0; background: transparent; border-radius: 9px; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-variant-numeric: tabular-nums; font-weight: 500; padding: 0; }
.cal-cell:hover { background: var(--surface-2); }
.cal-cell.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cal-cell.sel { background: var(--accent); color: var(--accent-ink); }
.dots { display: flex; gap: 2px; height: 5px; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--svc, var(--muted)); }
.cal-cell.sel .dot { background: var(--accent-ink); }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini .lbl { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.mini .val { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.mini .val.ok { color: var(--free); }

.day-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.day-head h2 { font-size: 22px; flex: 1 1 220px; min-width: 0; }
.day-head .sub { color: var(--muted); font-size: 13px; font-weight: 500; display: block; font-family: var(--font-body); letter-spacing: 0; margin-top: 2px; }
.day-nav { display: flex; gap: 6px; }
.timeline { display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; width: 100%;
  background: color-mix(in srgb, var(--svc) 9%, var(--surface)); border: 1px solid var(--line); border-left: 4px solid var(--svc);
  border-radius: 10px; padding: 11px 14px; }
.slot:hover { background: color-mix(in srgb, var(--svc) 16%, var(--surface)); }
.slot .t { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; line-height: 1.25; }
.slot .t small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.slot .who { font-weight: 600; overflow-wrap: anywhere; }
.slot .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--svc); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--svc); }
.slot .price { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.done { background: var(--free-soft); color: var(--free); }
.slot.cancel { opacity: .55; }
.slot.cancel .who { text-decoration: line-through; }
.gap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; border: 1.5px dashed color-mix(in srgb, var(--free) 55%, var(--line)); background: color-mix(in srgb, var(--free-soft) 55%, transparent); color: var(--free); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.gap .when { font-variant-numeric: tabular-nums; }
.gap .len { color: var(--muted); font-weight: 500; margin-left: 8px; }
.empty { text-align: center; padding: 18px 8px 4px; color: var(--muted); }

.svc-henna { --svc: var(--c-henna); } .svc-design { --svc: var(--c-design); } .svc-manu { --svc: var(--c-manu); }
.svc-colo { --svc: var(--c-colo); } .svc-laser { --svc: var(--c-laser); } .svc-x { --svc: var(--muted); }

/* Histórico */
.hist-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.hist-head h2 { font-size: 22px; flex: 1 1 200px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile .lbl { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.tile .val { font-family: var(--font-display); font-size: 28px; font-weight: 700; margin-top: 2px; }
.tile .val.ok { color: var(--free); }
.tile .note { color: var(--muted); font-size: 13px; }
.hist-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.bars { display: grid; gap: 12px; }
.bar-row .top2 { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--svc); border-radius: 99px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
.fchip { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 10px; }
.rows { display: grid; }
.hrow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 140px 74px 96px; gap: 10px; align-items: center; padding: 10px 6px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.hrow:hover { background: var(--surface-2); }
.hrow.head { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; cursor: default; border-top: 0; }
.hrow.head:hover { background: transparent; }
.hrow .r { text-align: right; font-variant-numeric: tabular-nums; }
.hrow .nm { font-weight: 600; overflow-wrap: anywhere; }
.hrow.total { font-weight: 700; border-top: 2px solid var(--line); cursor: default; }
.hrow.total:hover { background: transparent; }

/* Serviços */
.svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.svc-card { border-top: 4px solid var(--svc); }
.svc-card h3 { font-size: 18px; margin-bottom: 4px; }
.svc-card p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.field { display: grid; gap: 4px; margin-bottom: 12px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.in { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 11px; min-width: 0; }
.in:focus { border-color: var(--accent); }
textarea.in { resize: vertical; min-height: 64px; }
.help { font-size: 13px; color: var(--muted); margin: 0 0 14px; }

/* Folha de edição */
.backdrop { position: fixed; inset: 0; background: rgba(10, 6, 14, .5); z-index: 50; display: flex; justify-content: flex-end; }
.sheet { background: var(--bg); width: min(540px, 100%); height: 100%; overflow-y: auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 20px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-head h2 { font-size: 22px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.svc-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.svc-pick button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-weight: 600; font-size: 14px; display: inline-flex; gap: 7px; align-items: center; }
.svc-pick button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--svc); }
.svc-pick button[aria-pressed="true"] { background: color-mix(in srgb, var(--svc) 18%, var(--surface)); border-color: var(--svc); }
.status-box { border-radius: 10px; padding: 11px 13px; font-weight: 600; margin: 4px 0 14px; }
.status-box small { display: block; font-weight: 500; margin-top: 2px; }
.status-box.free { background: var(--free-soft); color: var(--free); }
.status-box.busy { background: var(--danger-soft); color: var(--danger); }
.status-box.idle { background: var(--surface-2); color: var(--muted); }
.avail h3 { font-size: 15px; margin-bottom: 8px; }
.avail .blk { margin-bottom: 12px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border-radius: 8px; padding: 5px 9px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; border: 1px solid transparent; }
.pill.busy { background: color-mix(in srgb, var(--svc) 14%, var(--surface)); color: var(--ink); border-left: 3px solid var(--svc); }
.pill.free { background: var(--free-soft); color: var(--free); border-color: color-mix(in srgb, var(--free) 35%, transparent); }
.pill.free:hover { filter: brightness(.96); }
.pill.free[aria-pressed="true"] { background: var(--free); color: var(--surface); }
.pill.short { background: var(--surface-2); color: var(--muted); font-weight: 500; }
.glabel { font-size: 12px; color: var(--muted); margin: 8px 0 5px; font-weight: 600; }
.sheet-foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.sheet-foot .grow { flex: 1; }
.formerr { color: var(--danger); font-weight: 600; margin-top: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 80; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; }

@media (max-width: 820px) {
  .agenda, .hist-grid { grid-template-columns: minmax(0, 1fr); }
  .tabs { margin-left: 0; order: 3; width: 100%; }
  .tab { flex: 1; }
  .top .btn.primary { margin-left: auto; }
  .hrow { grid-template-columns: 70px minmax(0, 1fr) 92px; }
  .hrow .hide-s { display: none; }
}
@media (max-width: 480px) {
  .slot { grid-template-columns: 78px minmax(0, 1fr); }
  .slot .price { grid-column: 2; text-align: left; }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
[hidden] { display: none !important; }
body { margin: 0; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Agenda</h1>
      <span>Cílios e sobrancelhas</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Seções">
      <button class="tab" role="tab" data-a="tab" data-v="agenda" id="tab-agenda">Agenda</button>
      <button class="tab" role="tab" data-a="tab" data-v="historico" id="tab-historico">Histórico</button>
      <button class="tab" role="tab" data-a="tab" data-v="servicos" id="tab-servicos">Serviços</button>
    </nav>
    <button class="btn primary" data-a="new" id="btn-new">+ Novo horário</button>
  </header>
  <div id="banner"></div>
  <main id="app"></main>
</div>

<div class="backdrop" id="backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">Novo horário</h2>
      <button class="icon-btn" data-a="close" aria-label="Fechar">✕</button>
    </div>

    <div class="field">
      <label for="f-cliente">Cliente</label>
      <input class="in" id="f-cliente" list="clientes" autocomplete="off" placeholder="Nome da cliente">
      <datalist id="clientes"></datalist>
    </div>

    <div class="field">
      <label id="lbl-svc">Procedimento</label>
      <div class="svc-pick" id="svc-pick" role="group" aria-labelledby="lbl-svc"></div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="f-dia">Data</label>
        <input class="in" type="date" id="f-dia">
      </div>
      <div class="field">
        <label for="f-hora">Hora</label>
        <input class="in" type="time" id="f-hora" step="300">
      </div>
    </div>

    <div id="status-box" class="status-box idle">Escolha o horário para ver se está livre.</div>

    <div class="row2">
      <div class="field">
        <label for="f-dur">Duração estimada (min)</label>
        <input class="in" type="number" id="f-dur" min="5" step="5" inputmode="numeric">
      </div>
      <div class="field">
        <label for="f-valor">Valor (R$)</label>
        <input class="in" type="text" id="f-valor" inputmode="decimal" placeholder="a definir">
      </div>
    </div>

    <div class="field">
      <label for="f-obs">Observação</label>
      <textarea class="in" id="f-obs" placeholder="Opcional"></textarea>
    </div>

    <div class="avail card" id="avail"></div>

    <div class="formerr" id="formerr" role="alert"></div>

    <div class="sheet-foot">
      <button class="btn primary" id="btn-save" data-a="save">Salvar</button>
      <button class="btn" data-a="close">Fechar</button>
      <span class="grow"></span>
    </div>
    <div class="sheet-foot" id="edit-actions" hidden>
      <button class="btn sm" data-a="toggle-done" id="btn-done">Marcar como feito</button>
      <button class="btn sm" data-a="toggle-cancel" id="btn-cancel">Cancelar atendimento</button>
      <span class="grow"></span>
      <button class="btn sm danger" data-a="delete" id="btn-delete">Excluir</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="backdrop" id="login" hidden style="align-items:center;justify-content:center">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="login-title" style="width:min(380px,calc(100% - 32px))">
    <h2 id="login-title" style="font-size:22px;margin-bottom:6px">Agenda</h2>
    <p class="help">Digite a senha para abrir a agenda.</p>
    <div class="field"><label for="f-senha">Senha</label><input class="in" type="password" id="f-senha" autocomplete="current-password"></div>
    <div class="formerr" id="login-msg" role="alert" style="margin:0 0 10px"></div>
    <button class="btn primary" data-a="login">Entrar</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- utilidades ---------- */
  const pad = n => String(n).padStart(2, "0");
  const toMin = h => { const p = String(h || "0:0").split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); };
  const fromMin = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
  const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parseYmd = s => { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const money = v => brl.format(v || 0);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const fmtDur = m => m < 60 ? m + " min" : Math.floor(m / 60) + "h" + (m % 60 ? pad(m % 60) : "");
  const $ = id => document.getElementById(id);

  const DIA_INI = 8 * 60, DIA_FIM = 21 * 60;

  /* ---------- serviços (valores padrão; podem ser ajustados na aba Serviços) ---------- */
  const SERV_BASE = {
    henna:  { nome: "Henna",                 curto: "Henna",      duracao: 30,  valor: 60,  renda: true },
    design: { nome: "Design de sobrancelha", curto: "Design",     duracao: 30,  valor: 50,  renda: true },
    manu:   { nome: "Manutenção de cílios",  curto: "Manutenção", duracao: 60,  valor: 120, renda: true },
    colo:   { nome: "Colocação de cílios",   curto: "Colocação",  duracao: 120, valor: 200, renda: true },
    laser:  { nome: "Laser",                 curto: "Laser",      duracao: 30,  valor: 0,   renda: false }
  };
  const SERV_ORDEM = ["manu", "colo", "design", "henna", "laser"];

  const state = {
    items: [], svcOver: {}, loaded: false, erro: null,
    tab: "agenda", sel: ymd(new Date()),
    cal: { y: new Date().getFullYear(), m: new Date().getMonth() },
    hist: { y: new Date().getFullYear(), m: new Date().getMonth(), f: "all", q: "" }
  };

  function svcOf(id) {
    const b = SERV_BASE[id] || { nome: id, curto: id, duracao: 30, valor: 0, renda: true };
    const o = state.svcOver[id] || {};
    return Object.assign({ id: id }, b, o.duracao != null ? { duracao: o.duracao } : {}, "valor" in o ? { valor: o.valor } : {});
  }
  const svcClass = id => SERV_BASE[id] ? "svc-" + id : "svc-x";

  /* ---------- regras da agenda ---------- */
  function endMin(i) { return toMin(i.hora) + (+i.duracao || 30); }

  function eff(i) {
    if (i.status === "cancelado") return "cancelado";
    if (i.status === "concluido") return "realizado";
    const p = i.dia.split("-").map(Number);
    const fim = new Date(p[0], p[1] - 1, p[2], 0, endMin(i));
    return fim <= new Date() ? "realizado" : "agendado";
  }

  function activeOfDay(dia, excludeId) {
    return state.items
      .filter(i => i.dia === dia && i.status !== "cancelado" && i.id !== excludeId)
      .sort((a, b) => toMin(a.hora) - toMin(b.hora));
  }

  function gapsOfDay(dia, excludeId) {
    const list = activeOfDay(dia, excludeId).map(i => [toMin(i.hora), endMin(i)]);
    const out = [];
    let cur = DIA_INI;
    list.forEach(([s, e]) => {
      if (s > cur && cur < DIA_FIM) out.push([cur, Math.min(s, DIA_FIM)]);
      cur = Math.max(cur, e);
    });
    if (cur < DIA_FIM) out.push([cur, DIA_FIM]);
    return out;
  }

  function conflictsFor(dia, hora, dur, excludeId) {
    const s = toMin(hora), e = s + dur;
    return activeOfDay(dia, excludeId).filter(i => s < endMin(i) && toMin(i.hora) < e);
  }

  function monthStats(y, m) {
    const key = y + "-" + pad(m + 1);
    const r = { real: 0, prev: 0, qtd: 0, semValor: 0, porSvc: {} };
    state.items.forEach(i => {
      if (!i.dia.startsWith(key)) return;
      const s = svcOf(i.servico);
      if (!s.renda) return;
      const st = eff(i);
      if (st === "cancelado") return;
      const v = i.valor == null ? 0 : +i.valor;
      if (i.valor == null) r.semValor++;
      if (st === "realizado") {
        r.real += v; r.qtd++;
        const b = r.porSvc[i.servico] || (r.porSvc[i.servico] = { qtd: 0, soma: 0 });
        b.qtd++; b.soma += v;
      } else r.prev += v;
    });
    return r;
  }

  /* ---------- renderização ---------- */
  function monthLabel(y, m) { return cap(new Date(y, m, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" })); }
  function dayLabel(dia) { return cap(parseYmd(dia).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" })); }

  function calHtml() {
    const { y, m } = state.cal;
    const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
    const today = ymd(new Date());
    let cells = ["D", "S", "T", "Q", "Q", "S", "S"].map(d => '<div class="cal-dow">' + d + "</div>").join("");
    for (let i = 0; i < first.getDay(); i++) cells += "<span></span>";
    for (let d = 1; d <= days; d++) {
      const dia = y + "-" + pad(m + 1) + "-" + pad(d);
      const its = activeOfDay(dia);
      const dots = its.slice(0, 4).map(i => '<span class="dot ' + svcClass(i.servico) + '"></span>').join("");
      const cls = "cal-cell" + (dia === today ? " today" : "") + (dia === state.sel ? " sel" : "");
      cells += '<button class="' + cls + '" data-a="pick" data-d="' + dia + '" aria-label="' + d + " de " + monthLabel(y, m) + ", " + its.length + ' horários"' + (dia === state.sel ? ' aria-current="date"' : "") + ">" + d + '<span class="dots">' + dots + "</span></button>";
    }
    const st = monthStats(y, m);
    return '<div class="card"><div class="cal-head"><button class="icon-btn" data-a="cal" data-n="-1" aria-label="Mês anterior">‹</button><h2>' + monthLabel(y, m) +
      '</h2><button class="icon-btn" data-a="cal" data-n="1" aria-label="Próximo mês">›</button></div><div class="cal-grid">' + cells + "</div></div>" +
      '<div class="card mini"><div><div class="lbl">Ganho no mês</div><div class="val ok num">' + money(st.real) + '</div></div><div><div class="lbl">A receber</div><div class="val num">' + money(st.prev) + "</div></div></div>";
  }

  function slotHtml(i) {
    const s = svcOf(i.servico), st = eff(i);
    const price = !s.renda ? "—" : (i.valor == null ? '<span class="tag warn">sem valor</span>' : money(+i.valor));
    const tag = st === "cancelado" ? '<span class="tag">cancelado</span>' : (st === "realizado" ? '<span class="tag done">feito</span>' : "");
    return '<button class="slot ' + svcClass(i.servico) + (st === "cancelado" ? " cancel" : "") + '" data-a="edit" data-id="' + esc(i.id) + '">' +
      '<span class="t">' + i.hora + "<small>até " + fromMin(endMin(i)) + "</small></span>" +
      '<span><span class="who">' + esc(i.cliente) + '</span><span class="meta"><span class="chip">' + esc(s.curto) + "</span><span>" + fmtDur(+i.duracao || 30) + "</span>" + tag + (i.obs ? "<span>" + esc(i.obs) + "</span>" : "") + "</span></span>" +
      '<span class="price">' + price + "</span></button>";
  }

  function gapHtml(g) {
    return '<div class="gap"><span class="when">Livre · ' + fromMin(g[0]) + " – " + fromMin(g[1]) + '<span class="len">' + fmtDur(g[1] - g[0]) + '</span></span><button class="btn sm" data-a="book" data-h="' + fromMin(g[0]) + '">Marcar aqui</button></div>';
  }

  function dayHtml() {
    const dia = state.sel;
    const all = state.items.filter(i => i.dia === dia);
    const act = all.filter(i => i.status !== "cancelado");
    const soma = act.reduce((t, i) => t + (svcOf(i.servico).renda && i.valor != null ? +i.valor : 0), 0);
    const rows = [];
    all.forEach(i => rows.push({ s: toMin(i.hora), h: slotHtml(i) }));
    gapsOfDay(dia).filter(g => g[1] - g[0] >= 30).forEach(g => rows.push({ s: g[0], h: gapHtml(g) }));
    rows.sort((a, b) => a.s - b.s);
    const sub = act.length ? act.length + (act.length === 1 ? " horário" : " horários") + " · " + money(soma) : "Nenhum horário marcado";
    const empty = act.length === 0 ? '<p class="empty">Dia livre. Toque em “Marcar aqui” ou em “Novo horário”.</p>' : "";
    return '<div class="card"><div class="day-head"><h2>' + dayLabel(dia) + '<span class="sub num">' + sub + '</span></h2><div class="day-nav"><button class="icon-btn" data-a="day" data-n="-1" aria-label="Dia anterior">‹</button><button class="btn sm" data-a="today">Hoje</button><button class="icon-btn" data-a="day" data-n="1" aria-label="Próximo dia">›</button></div></div><div class="timeline">' +
      rows.map(r => r.h).join("") + "</div>" + empty + "</div>";
  }

  function agendaHtml() {
    return '<div class="agenda"><div class="side">' + calHtml() + "</div><div>" + dayHtml() + "</div></div>";
  }

  function histHtml() {
    const { y, m, f, q } = state.hist;
    const st = monthStats(y, m);
    const key = y + "-" + pad(m + 1);
    const ticket = st.qtd ? st.real / st.qtd : 0;
    const maxSoma = Math.max(1, ...Object.values(st.porSvc).map(b => b.soma));
    const bars = SERV_ORDEM.filter(id => st.porSvc[id]).map(id => {
      const b = st.porSvc[id], s = svcOf(id);
      return '<div class="bar-row ' + svcClass(id) + '"><div class="top2"><span>' + esc(s.curto) + " · " + b.qtd + '</span><span class="num">' + money(b.soma) + '</span></div><div class="bar"><i style="width:' + Math.max(3, (b.soma / maxSoma) * 100) + '%"></i></div></div>';
    }).join("") || '<p class="help">Os procedimentos feitos aparecem aqui.</p>';
    const filt = ['<button class="fchip" data-a="hf" data-f="all" aria-pressed="' + (f === "all") + '">Todos</button>']
      .concat(SERV_ORDEM.filter(id => SERV_BASE[id].renda).map(id => '<button class="fchip" data-a="hf" data-f="' + id + '" aria-pressed="' + (f === id) + '">' + esc(svcOf(id).curto) + "</button>")).join("");
    return '<div class="hist-head"><h2>' + monthLabel(y, m) + '</h2><button class="icon-btn" data-a="hm" data-n="-1" aria-label="Mês anterior">‹</button><button class="icon-btn" data-a="hm" data-n="1" aria-label="Próximo mês">›</button></div>' +
      '<div class="tiles"><div class="card tile"><div class="lbl">Ganho no mês</div><div class="val ok num">' + money(st.real) + '</div><div class="note">procedimentos já feitos</div></div>' +
      '<div class="card tile"><div class="lbl">A receber</div><div class="val num">' + money(st.prev) + '</div><div class="note">ainda agendados no mês</div></div>' +
      '<div class="card tile"><div class="lbl">Procedimentos</div><div class="val num">' + st.qtd + '</div><div class="note">' + (st.semValor ? st.semValor + " sem valor definido" : "todos com valor") + "</div></div>" +
      '<div class="card tile"><div class="lbl">Ticket médio</div><div class="val num">' + money(ticket) + '</div><div class="note">por procedimento</div></div></div>' +
      '<div class="hist-grid"><div class="card"><div class="filters">' + filt + '<input class="search" id="hist-q" type="search" placeholder="Buscar cliente" value="' + esc(q) + '" aria-label="Buscar cliente"></div><div class="rows" id="hist-rows">' + histRows(key, f, q) + '</div></div>' +
      '<div class="card"><h3 style="margin-bottom:12px">Por procedimento</h3><div class="bars">' + bars + "</div></div></div>";
  }

  function histRows(key, f, q) {
    const list = state.items.filter(i => i.dia.startsWith(key) && svcOf(i.servico).renda && eff(i) === "realizado" &&
      (f === "all" || i.servico === f) && (!q || norm(i.cliente).includes(norm(q))))
      .sort((a, b) => (b.dia + b.hora).localeCompare(a.dia + a.hora));
    if (!list.length) return '<p class="empty">Nenhum procedimento feito neste mês' + (f !== "all" || q ? " com esse filtro" : "") + ".</p>";
    const total = list.reduce((t, i) => t + (i.valor == null ? 0 : +i.valor), 0);
    return '<div class="hrow head"><span>Data</span><span>Cliente</span><span class="hide-s">Procedimento</span><span class="r hide-s">Duração</span><span class="r">Valor</span></div>' +
      list.map(i => {
        const s = svcOf(i.servico), d = parseYmd(i.dia);
        return '<button class="hrow ' + svcClass(i.servico) + '" data-a="edit" data-id="' + esc(i.id) + '"><span class="num">' + pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + " " + i.hora + '</span><span class="nm">' + esc(i.cliente) +
          '</span><span class="hide-s"><span class="chip">' + esc(s.curto) + '</span></span><span class="r hide-s">' + fmtDur(+i.duracao || 30) + '</span><span class="r">' + (i.valor == null ? '<span class="tag warn">sem valor</span>' : money(+i.valor)) + "</span></button>";
      }).join("") +
      '<div class="hrow total"><span></span><span>Total · ' + list.length + '</span><span class="hide-s"></span><span class="hide-s"></span><span class="r">' + money(total) + "</span></div>";
  }

  function servHtml() {
    return '<p class="help">Tempo e valor padrão de cada procedimento. Ao marcar um horário, a duração e o valor já vêm preenchidos (e podem ser mudados na hora).</p><div class="svc-grid">' +
      SERV_ORDEM.map(id => {
        const s = svcOf(id);
        return '<div class="card svc-card ' + svcClass(id) + '"><h3>' + esc(s.nome) + "</h3><p>" + (s.renda ? "Entra no ganho do mês" : "Compromisso sem valor, só ocupa o horário") + '</p>' +
          '<div class="field"><label for="sv-dur-' + id + '">Duração (min)</label><input class="in" type="number" min="5" step="5" id="sv-dur-' + id + '" data-sv="' + id + '" data-k="duracao" value="' + s.duracao + '"></div>' +
          (s.renda ? '<div class="field"><label for="sv-val-' + id + '">Valor padrão (R$)</label><input class="in" type="text" inputmode="decimal" id="sv-val-' + id + '" data-sv="' + id + '" data-k="valor" value="' + (s.valor == null ? "" : s.valor) + '"></div>' : "") +
          "</div>";
      }).join("") + "</div>" +
      '<div class="card" style="margin-top:16px"><h3 style="margin-bottom:6px">Backup</h3><p class="help">Os horários ficam guardados no servidor e aparecem em todos os aparelhos. O backup é uma cópia em arquivo. Importar substitui tudo o que está na agenda.</p><div class="sheet-foot" style="margin-top:0"><button class="btn" data-a="export">Baixar backup</button><button class="btn" data-a="import">Importar backup</button><input type="file" id="imp-file" accept="application/json,.json" hidden></div></div>';
  }

  function render() {
    const ae = document.activeElement;
    const keep = ae && ae.id && $("app").contains(ae) ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
    ["agenda", "historico", "servicos"].forEach(t => $("tab-" + t).setAttribute("aria-selected", String(state.tab === t)));
    $("app").innerHTML = state.tab === "agenda" ? agendaHtml() : state.tab === "historico" ? histHtml() : servHtml();
    if (keep) {
      const el = $(keep.id);
      if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} }
    }
    const msg = state.loaded ? (state.erro ? "Sem conexão. Mostrando a última versão carregada." : "") : (state.erro ? "Não foi possível abrir a agenda: " + state.erro + "." : "Carregando a agenda…");
    $("banner").innerHTML = msg ? '<div class="banner" role="status">' + esc(msg) + "</div>" : "";
    const dl = $("clientes");
    const nomes = {};
    state.items.forEach(i => { if (i.cliente && norm(i.cliente) !== "laser") nomes[norm(i.cliente)] = i.cliente; });
    dl.innerHTML = Object.values(nomes).sort((a, b) => a.localeCompare(b, "pt-BR")).map(n => '<option value="' + esc(n) + '"></option>').join("");
  }

  function refresh() { render(); if (!$("backdrop").hidden) updateAvail(); }

  /* ---------- folha de edição ---------- */
  const F = { id: null, servico: "manu", tDur: false, tVal: false, confirmDel: false, saving: false };

  function svcPickHtml() {
    $("svc-pick").innerHTML = SERV_ORDEM.map(id => '<button type="button" class="' + svcClass(id) + '" data-a="svc" data-s="' + id + '" aria-pressed="' + (F.servico === id) + '">' + esc(svcOf(id).curto) + "</button>").join("");
  }

  function applyDefaults() {
    const s = svcOf(F.servico);
    if (!F.tDur) $("f-dur").value = s.duracao;
    if (!F.tVal) $("f-valor").value = s.renda ? (s.valor || s.valor === 0 ? s.valor : "") : "";
  }

  function openSheet(opt) {
    opt = opt || {};
    const it = opt.id ? state.items.find(x => x.id === opt.id) : null;
    if (opt.id && !it) return;
    F.id = it ? it.id : null; F.confirmDel = false; F.saving = false;
    F.servico = it ? it.servico : (opt.servico || "manu");
    F.tDur = !!it; F.tVal = !!it;
    $("sheet-title").textContent = it ? "Editar horário" : "Novo horário";
    $("f-cliente").value = it ? it.cliente : "";
    $("f-dia").value = it ? it.dia : state.sel;
    $("f-hora").value = it ? it.hora : (opt.hora || "");
    $("f-dur").value = it ? it.duracao : "";
    $("f-valor").value = it ? (it.valor == null ? "" : it.valor) : "";
    $("f-obs").value = it ? (it.obs || "") : "";
    $("formerr").textContent = "";
    $("edit-actions").hidden = !it;
    svcPickHtml();
    if (!it) applyDefaults();
    syncEditButtons();
    $("backdrop").hidden = false;
    document.body.style.overflow = "hidden";
    updateAvail();
    if (!it) $("f-cliente").focus();
  }

  function closeSheet() {
    $("backdrop").hidden = true;
    document.body.style.overflow = "";
    F.id = null;
  }

  function syncEditButtons() {
    const it = F.id ? state.items.find(x => x.id === F.id) : null;
    $("btn-done").textContent = it && it.status === "concluido" ? "Desmarcar como feito" : "Marcar como feito";
    $("btn-cancel").textContent = it && it.status === "cancelado" ? "Reativar horário" : "Cancelar atendimento";
    $("btn-delete").textContent = F.confirmDel ? "Confirmar exclusão" : "Excluir";
  }

  function updateAvail() {
    const dia = $("f-dia").value, hora = $("f-hora").value;
    const dur = Math.max(5, parseInt($("f-dur").value, 10) || svcOf(F.servico).duracao);
    const box = $("status-box"), av = $("avail");
    const saveBtn = $("btn-save");
    if (!dia) {
      box.className = "status-box idle"; box.textContent = "Escolha a data.";
      av.hidden = true; saveBtn.textContent = "Salvar"; saveBtn.className = "btn primary"; return;
    }
    av.hidden = false;
    let conf = [];
    if (hora) {
      conf = conflictsFor(dia, hora, dur, F.id);
      const faixa = hora + " – " + fromMin(toMin(hora) + dur);
      if (conf.length) {
        box.className = "status-box busy";
        box.innerHTML = "Horário ocupado" + conf.map(c => "<small>" + esc(c.cliente) + " (" + esc(svcOf(c.servico).curto) + ") · " + c.hora + " – " + fromMin(endMin(c)) + "</small>").join("") + "<small>Sugestões livres abaixo.</small>";
      } else {
        box.className = "status-box free";
        box.innerHTML = "Horário livre<small>" + faixa + " · " + fmtDur(dur) + "</small>";
      }
    } else {
      box.className = "status-box idle"; box.textContent = "Escolha o horário para ver se está livre.";
    }
    saveBtn.textContent = conf.length ? "Salvar mesmo assim" : "Salvar";
    saveBtn.className = conf.length ? "btn warn" : "btn primary";

    const busy = activeOfDay(dia, F.id);
    const gaps = gapsOfDay(dia, F.id);
    const fits = [], short = [];
    gaps.forEach(g => {
      const starts = [g[0]];
      for (let c = Math.ceil((g[0] + 1) / 30) * 30; c + dur <= g[1]; c += 30) starts.push(c);
      const ok = starts.filter(s => s + dur <= g[1]);
      if (ok.length) ok.forEach(s => fits.push(s)); else if (g[1] - g[0] >= 15) short.push(g);
    });
    const busyHtml = busy.length ? busy.map(i => '<span class="pill busy ' + svcClass(i.servico) + '">' + i.hora + "–" + fromMin(endMin(i)) + " " + esc(i.cliente) + "</span>").join("") : '<span class="pill short">Nenhum horário marcado</span>';
    const freeHtml = fits.length ? fits.slice(0, 40).map(s => '<button type="button" class="pill free" data-a="chip" data-h="' + fromMin(s) + '" aria-pressed="' + (hora === fromMin(s)) + '">' + fromMin(s) + "</button>").join("") : '<span class="pill short">Nenhum encaixe de ' + fmtDur(dur) + " neste dia</span>";
    const shortHtml = short.length ? '<div class="glabel">Livres, mas curtos para ' + fmtDur(dur) + '</div><div class="pills">' + short.map(g => '<span class="pill short">' + fromMin(g[0]) + "–" + fromMin(g[1]) + "</span>").join("") + "</div>" : "";
    av.innerHTML = '<h3>' + dayLabel(dia) + '</h3><div class="blk"><div class="glabel">Ocupado</div><div class="pills">' + busyHtml + '</div></div><div class="blk"><div class="glabel">Horários disponíveis para ' + fmtDur(dur) + ' (toque para escolher)</div><div class="pills">' + freeHtml + "</div>" + shortHtml + "</div>";
  }

  async function saveForm() {
    if (F.saving) return;
    const err = $("formerr"); err.textContent = "";
    let cliente = $("f-cliente").value.trim();
    if (!cliente && F.servico === "laser") cliente = "Laser";
    const dia = $("f-dia").value, hora = $("f-hora").value;
    const dur = parseInt($("f-dur").value, 10);
    const vtxt = $("f-valor").value.trim().replace(/^R\$\s*/i, "").replace(/\./g, "").replace(",", ".");
    const valor = vtxt === "" ? null : Number(vtxt);
    if (!cliente) { err.textContent = "Informe o nome da cliente."; $("f-cliente").focus(); return; }
    if (!dia) { err.textContent = "Escolha a data."; return; }
    if (!hora) { err.textContent = "Escolha o horário."; $("f-hora").focus(); return; }
    if (!dur || dur < 5) { err.textContent = "Informe a duração em minutos."; $("f-dur").focus(); return; }
    if (valor != null && (!isFinite(valor) || valor < 0)) { err.textContent = "Valor inválido."; $("f-valor").focus(); return; }
    const prev = F.id ? state.items.find(x => x.id === F.id) : null;
    const doc = { cliente: cliente, servico: F.servico, dia: dia, hora: hora, duracao: dur, valor: valor, obs: $("f-obs").value.trim(), status: prev ? (prev.status || "agendado") : "agendado" };
    F.saving = true; $("btn-save").disabled = true;
    try {
      const saved = await api("/api/item", { method: "POST", body: Object.assign({}, doc, F.id ? { id: F.id } : {}) });
      upsertLocal(saved);
      const d = parseYmd(dia);
      state.sel = dia; state.cal = { y: d.getFullYear(), m: d.getMonth() };
      state.tab = "agenda"; location.hash = "agenda";
      closeSheet(); toast("Horário salvo");
      refresh();
    } catch (e) {
      err.textContent = "Não foi possível salvar. Tente de novo.";
    } finally { F.saving = false; $("btn-save").disabled = false; }
  }

  async function patchStatus(status) {
    const it = state.items.find(x => x.id === F.id);
    if (!it) return;
    try {
      const saved = await api("/api/item", { method: "POST", body: Object.assign({}, it, { status: status }) });
      upsertLocal(saved); closeSheet(); toast("Atualizado"); render();
    } catch (e) { if (e.message !== "401") $("formerr").textContent = "Não foi possível atualizar."; }
  }

  async function deleteItem() {
    if (!F.id) return;
    if (!F.confirmDel) { F.confirmDel = true; syncEditButtons(); return; }
    try {
      await api("/api/item?id=" + encodeURIComponent(F.id), { method: "DELETE" });
      state.items = state.items.filter(x => x.id !== F.id);
      closeSheet(); toast("Horário excluído"); render();
    } catch (e) { if (e.message !== "401") $("formerr").textContent = "Não foi possível excluir."; }
  }

  let toastT;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200);
  }

  /* ---------- eventos ---------- */
  function shiftDay(n) {
    const d = parseYmd(state.sel); d.setDate(d.getDate() + n);
    state.sel = ymd(d); state.cal = { y: d.getFullYear(), m: d.getMonth() };
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-a]");
    if (!t) { if (e.target === $("backdrop")) closeSheet(); return; }
    const a = t.dataset.a;
    if (a === "tab") { state.tab = t.dataset.v; location.hash = t.dataset.v; render(); }
    else if (a === "new") openSheet({});
    else if (a === "close") closeSheet();
    else if (a === "save") saveForm();
    else if (a === "edit") openSheet({ id: t.dataset.id });
    else if (a === "book") openSheet({ hora: t.dataset.h });
    else if (a === "pick") { state.sel = t.dataset.d; render(); }
    else if (a === "cal") { const d = new Date(state.cal.y, state.cal.m + (+t.dataset.n), 1); state.cal = { y: d.getFullYear(), m: d.getMonth() }; render(); }
    else if (a === "day") { shiftDay(+t.dataset.n); render(); }
    else if (a === "today") { const d = new Date(); state.sel = ymd(d); state.cal = { y: d.getFullYear(), m: d.getMonth() }; render(); }
    else if (a === "hm") { const d = new Date(state.hist.y, state.hist.m + (+t.dataset.n), 1); state.hist.y = d.getFullYear(); state.hist.m = d.getMonth(); render(); }
    else if (a === "hf") { state.hist.f = t.dataset.f; render(); }
    else if (a === "svc") { F.servico = t.dataset.s; svcPickHtml(); applyDefaults(); updateAvail(); }
    else if (a === "chip") { $("f-hora").value = t.dataset.h; updateAvail(); }
    else if (a === "toggle-done") { const it = state.items.find(x => x.id === F.id); patchStatus(it && it.status === "concluido" ? "agendado" : "concluido"); }
    else if (a === "toggle-cancel") { const it = state.items.find(x => x.id === F.id); patchStatus(it && it.status === "cancelado" ? "agendado" : "cancelado"); }
    else if (a === "delete") deleteItem();
    else if (a === "export") exportData();
    else if (a === "import") $("imp-file").click();
    else if (a === "login") doLogin();
  });

  document.addEventListener("input", e => {
    const id = e.target.id;
    if (id === "hist-q") { state.hist.q = e.target.value; $("hist-rows").innerHTML = histRows(state.hist.y + "-" + pad(state.hist.m + 1), state.hist.f, state.hist.q); return; }
    if (id === "f-dur") { F.tDur = true; updateAvail(); }
    else if (id === "f-valor") F.tVal = true;
    else if (id === "f-dia" || id === "f-hora") updateAvail();
  });

  document.addEventListener("change", async e => {
    const el = e.target;
    if (el.id === "imp-file") { importFile(el); return; }
    if (!el.dataset || !el.dataset.sv) return;
    const id = el.dataset.sv, cur = svcOf(id);
    let dur = cur.duracao, val = cur.valor;
    if (el.dataset.k === "duracao") { dur = Math.max(5, parseInt(el.value, 10) || cur.duracao); }
    else { const v = el.value.trim().replace(/^R\$\s*/i, "").replace(",", "."); val = v === "" ? null : (isFinite(Number(v)) ? Number(v) : cur.valor); }
    try {
      await api("/api/servico", { method: "PUT", body: { id: id, nome: cur.nome, duracao: dur, valor: val } });
      state.svcOver[id] = { nome: cur.nome, duracao: dur, valor: val };
      toast("Serviço atualizado"); render();
    } catch (err) { if (err.message !== "401") toast("Não foi possível salvar"); }
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !$("backdrop").hidden) closeSheet();
    if (e.key === "Enter" && e.target.id === "f-senha") doLogin();
  });

  function readHash() {
    const h = location.hash.replace("#", "");
    if (["agenda", "historico", "servicos"].includes(h)) state.tab = h;
  }
  window.addEventListener("hashchange", () => { readHash(); render(); });

  /* ---------- dados (servidor Cloudflare) ---------- */
  const SKEY = "agenda-cilios-senha";
  const getSenha = () => { try { return localStorage.getItem(SKEY) || ""; } catch (e) { return ""; } };
  const setSenha = v => { try { localStorage.setItem(SKEY, v); } catch (e) {} };

  async function api(path, opt) {
    opt = opt || {};
    let res;
    try {
      res = await fetch(path, {
        method: opt.method || "GET",
        headers: Object.assign({ "x-senha": encodeURIComponent(getSenha()) }, opt.body ? { "content-type": "application/json" } : {}),
        body: opt.body ? JSON.stringify(opt.body) : undefined
      });
    } catch (e) { throw new Error("sem conexão"); }
    if (res.status === 401) { showLogin(getSenha() ? "Senha incorreta." : ""); throw new Error("401"); }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((data && data.error) || ("erro " + res.status));
    return data;
  }

  function showLogin(msg) {
    $("login").hidden = false;
    $("login-msg").textContent = msg || "";
    $("f-senha").value = "";
    $("f-senha").focus();
  }
  function hideLogin() { $("login").hidden = true; }
  function doLogin() {
    const v = $("f-senha").value;
    if (!v) return;
    setSenha(v);
    $("login-msg").textContent = "Entrando…";
    loadAll();
  }

  function upsertLocal(item) {
    const i = state.items.findIndex(x => x.id === item.id);
    if (i >= 0) state.items[i] = item; else state.items.push(item);
  }

  let loading = false;
  async function loadAll(quiet) {
    if (loading) return;
    const ae = document.activeElement;
    if (quiet && ae && ae.id && ae.id.indexOf("sv-") === 0) return;
    loading = true;
    try {
      const d = await api("/api/dados");
      state.items = d.items || []; state.svcOver = d.svcOver || {};
      state.loaded = true; state.erro = null;
      hideLogin(); refresh();
    } catch (e) {
      if (e.message !== "401") { state.erro = e.message; render(); }
    } finally { loading = false; }
  }

  function exportData() {
    const blob = new Blob([JSON.stringify({ v: 1, items: state.items, svcOver: state.svcOver }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "agenda-backup-" + ymd(new Date()) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function importFile(input) {
    const f = input.files && input.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.items)) throw new Error("formato");
        await api("/api/importar", { method: "POST", body: { items: d.items, svcOver: d.svcOver || {} } });
        await loadAll(); toast("Backup carregado");
      } catch (e) { if (e.message !== "401") toast("Arquivo de backup inválido"); }
      input.value = "";
    };
    r.readAsText(f);
  }

  function boot() {
    readHash(); render(); loadAll();
    setInterval(() => { if (!document.hidden) loadAll(true); }, 20000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadAll(true); });
  }
  boot();
})();
</script>
</body>
</html>
